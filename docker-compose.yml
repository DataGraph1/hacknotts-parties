networks:
  netparties:
    name: netparties
    ipam:
      config:
        - subnet: 172.39.0.0/24

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 5s

    env_file: ".env"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - netparties
  
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /usr/local/app/src
        - action: rebuild
          path: ./backend/requirements.txt

    env_file:
      - .env
    networks:
      - netparties
    depends_on:
      postgres:
        condition: service_healthy
  
  frontend:
    build:
      context: ./frontend
      target: dev

    ports:
      - "5173:5173"

    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: rebuild
          path: ./frontend/package.json

    env_file:
      - .env

    networks:
      - netparties

    depends_on:
      - postgres
      - backend

volumes:
  postgres_data: